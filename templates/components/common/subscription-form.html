<h3 class="eyeva__newsletter-heading">
    {{#and settings.show_newsletter_summary settings.newsletter_summary}}
        {{settings.newsletter_summary}}
    {{else}}
        {{lang 'newsletter.subscribe'}}
    {{/and}}
</h3>

<form class="form eyeva__newsletter-form" action="{{urls.subscribe.action}}" method="post">
    <fieldset class="form-fieldset">
        <input type="hidden" name="action" value="subscribe">
        <input type="hidden" name="nl_first_name" value="bc">
        <input type="hidden" name="check" value="1">
        <div class="form-field">
            <label class="form-label is-srOnly" for="nl_email">{{lang 'common.email_address'}}</label>
            <div class="form-prefixPostfix">
                <input class="form-input"
                       id="nl_email"
                       name="nl_email"
                       type="email"
                       value="{{customer.email}}"
                       placeholder="{{lang 'newsletter.email_placeholder'}}"
                       aria-describedby="alertBox-message-text"
                       aria-required="true"
                       autocomplete="email"
                       required
                >
                {{!--
                <input class="button button--primary form-prefixPostfix-button--postfix"
                       type="submit"
                       value="{{lang 'newsletter.subscribe_submit'}}"
                       >
                --}}
            </div>
        </div>
    </fieldset>
</form>
