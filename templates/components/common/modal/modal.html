<div id="modal" class="modal" data-reveal data-prevent-quick-search-close>
    {{> components/common/modal/modal-close-btn}}
    <div id="modal-content" class="modal-content"></div>
    <div class="loadingOverlay"></div>
</div>

<div id="previewModal" class="modal modal--large" data-reveal>
    {{> components/common/modal/modal-close-btn }}
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-header-title"></div>
    <div class="loadingOverlay"></div>
</div>

{{> components/papathemes/create-wishlist-modal}}

{{#if settings.show_wishlist}}
    <script type="text/x-template" id="cardWishlistTemplate" nonce="{{nonce}}">
        {{> components/products/card-wishlist-dropdown id="%%PRODUCT_ID%%" name="%%PRODUCT_NAME%%"}}
    </script>
{{/if}}

<script type="text/x-template" id="quickSearchModalTemplate"
    data-modal-title="{{lang 'search.quick_search.header' name=settings.store_name}}"
    nonce="{{nonce}}"
>
    {{> components/common/quick-search name='nav-quick-search'}}
</script>
