    <div id="team-container"></div>
    <script>
      const teamData = JSON.parse(document.getElementById('team-data').textContent);
      const container = document.getElementById('team-container');

      teamData.forEach((member, i) => {
        const card = document.createElement('div');
        card.className = 'photo-container';
        card.innerHTML = `
      <div class="team-photo">
        <img class="bio-pic" src="${member.photo}" width="250" height="250">
      </div>
      <div class="name-plate">
        <h3 class="header-name">${member.name}</h3>
        <button class="moreInfo" data-index="${i}">More info...</button>
      </div>
    `;
        container.appendChild(card);

        const modal = document.createElement('div');
        modal.className = 'biomodal';
        modal.id = `biomodal-${i}`;
        modal.innerHTML = `
      <div class="team-modal-content">
        <h2><u>${member.name}</u></h2>
        ${member.bio.map(p => `<p class="bio-text">${p}</p>`).join('')}
        <div class="bio-container">
          <p class="bio-text">Phone: <a href="tel:${member.phone}">${member.phone}</a></p>
          <p class="bio-text">Email: <a href="mailto:${member.email}">${member.email}</a></p>
        </div>
        <button class="close button button--primary">Close</button>
      </div>
    `;
        container.appendChild(modal);
      });

      container.addEventListener('click', e => {
        if (e.target.classList.contains('moreInfo')) {
          const index = e.target.dataset.index;
          document.getElementById(`biomodal-${index}`).style.display = 'block';
        }
        if (e.target.classList.contains('close')) {
          e.target.closest('.biomodal').style.display = 'none';
        }
      });

      window.addEventListener('click', e => {
        if (e.target.classList.contains('biomodal')) {
          e.target.style.display = 'none';
        }
      });
    </script>
